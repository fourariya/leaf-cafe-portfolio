<!doctype html>
<!--
  Source for assets/og-image.png (1200x630 social preview card).
  Render: serve the project root (npm run serve), open /tools/og-card.html at a
  1200x630 viewport and screenshot the page. Uses only the site's own artwork.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Leaf Café OG card</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Kanit:wght@500;600&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 470px;
        align-items: center;
        padding: 0 0 0 84px;
        background: #f8f7ef;
        color: #193b2f;
        font-family: "DM Sans", system-ui, sans-serif;
      }
      .band {
        position: absolute;
        inset: 0 0 auto 0;
        height: 14px;
        background: #193b2f;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.05em;
      }
      .logo svg {
        width: 52px;
        height: 52px;
      }
      .logo b {
        color: #7f9a4e;
      }
      h1 {
        margin: 38px 0 14px;
        font-family: "Kanit", sans-serif;
        font-size: 74px;
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }
      h1 em {
        display: block;
        color: #6a8a4c;
        font-style: normal;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 30px;
      }
      .tags span {
        padding: 9px 16px;
        border: 1px solid #cfd9c8;
        border-radius: 999px;
        color: #2f5139;
        font-size: 17px;
        font-weight: 700;
      }
      .demo {
        position: absolute;
        right: 36px;
        bottom: 30px;
        padding: 10px 18px;
        border-radius: 999px;
        background: #193b2f;
        color: #f6fae7;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .art {
        align-self: end;
        height: 600px;
        overflow: hidden;
        border-radius: 235px 235px 0 0;
        background: #c5d4b2;
      }
      .art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.08); /* hide the artwork's own rounded edge */
      }
    </style>
  </head>
  <body>
    <div class="band"></div>
    <div>
      <div class="logo">
        <svg viewBox="0 0 42 42" fill="none" aria-hidden="true">
          <circle cx="21" cy="21" r="20" fill="#27503D" />
          <path
            d="M29.5 11.6C16 11 11.3 18.2 12.6 25c1.3 6.7 9.8 9.1 14.9 3.8 4.9-5 2-11.7 2-17.2Z"
            fill="#DDEAAB"
          />
          <path
            d="M13.8 29c5.2-8 11-11.1 15.2-14"
            stroke="#27503D"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
        <span>leaf<b>.</b> café</span>
      </div>
      <h1>Matcha • Coffee<em>• Dessert</em></h1>
      <div class="tags">
        <span>Responsive</span>
        <span>TH / EN</span>
        <span>Interactive menu</span>
      </div>
    </div>
    <div class="art"><img src="../assets/hero-matcha.svg" alt="" /></div>
    <div class="demo">DEMO WEBSITE · FICTIONAL CAFÉ</div>
  </body>
</html>
